name: wander_env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10  # Downgrade to 3.10 to satisfy pyproj
  - streamlit=1.25.0
  - geopandas=0.12.2  # Updated to avoid shapely conflict
  - pyproj=3.3.1
  - shapely=1.8.5  # Compatible with geopandas=0.12.2
  - fiona>=1.9.5
  - pandas=1.5.3
  - numpy>=1.23.5,<2.0.0  # Compatible with pandas=1.5.3
  - folium=0.14.0
  - altair=5.4.1  # Slightly older to avoid conflicts
  - matplotlib=3.7.1
  - seaborn=0.12.2
  - openpyxl=3.0.10
  - proj>=8.0
  - gdal>=3.3
  - geos>=3.9
  - pip
  - pip:
    - firebase-admin==6.7.0
    - pinecone==6.0.2